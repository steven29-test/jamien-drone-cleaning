name: Validate Stage preview
on:
  push:
    branches: [Stage]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
# Vercel Git integration deploys Stage as a preview. No production deploy action.
